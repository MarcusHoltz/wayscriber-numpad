[main]
# Numpad behaves normally here. wayscriber.sh applies the drawing-control
# bindings at runtime via `keyd bind` (see: ./wayscriber.sh start) and
# removes them with `keyd bind reset` (see: ./wayscriber.sh stop).
# No static kp* bindings live in this file, so the numpad still types
# normal digits until you turn drawing controls on.
